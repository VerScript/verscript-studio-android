<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Left Capsule Gradient: Electric Cyan to Sky Blue -->
    <linearGradient id="vLeftGrad" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#00FFCC"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0077fe"/>
    </linearGradient>

    <!-- Right Capsule Gradient: Bright Magenta to Deep Neon Violet -->
    <linearGradient id="vRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="30%" stop-color="#bd00ff"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>

    <!-- Overlap Gradient: Translucent Blend -->
    <linearGradient id="vOverlapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="vBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFCC"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#bd00ff"/>
    </linearGradient>

    <!-- Soft Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  
      <rect x="20" y="20" width="472" height="472" rx="110" fill="#0d111c" stroke="url(#vLeftGrad)" stroke-width="6" opacity="0.9"/>
      <rect x="220" y="44" width="72" height="8" rx="4" fill="rgba(255,255,255,0.25)"/>
      <circle cx="256" cy="460" r="10" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
    

  <g id="verscript-mark">
    <!-- Left Arm Capsule: angled from (132, 90) to (256, 420) -->
    <rect x="-48" y="-180" width="96" height="360" rx="48" 
          transform="translate(194, 255) rotate(-24.5)" 
          fill="url(#vLeftGrad)" />

    <!-- Right Arm Capsule: angled from (380, 90) to (256, 420) with blend -->
    <rect x="-48" y="-180" width="96" height="360" rx="48" 
          transform="translate(318, 255) rotate(24.5)" 
          fill="url(#vRightGrad)" 
          opacity="0.94" 
          style="mix-blend-mode: screen;" />

    <!-- Intersection Gem Accent (The translucent overlapping apex) -->
    <path d="M 256 312 L 298 392 L 256 438 L 214 392 Z" 
          fill="url(#vOverlapGrad)" 
          opacity="0.85" />
  </g>

  
</svg>